<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>


    <main class="container">

        <!-- Add Student -->
        <section class="card">

            <h2>Add Student</h2>

            <form action="/add-student" method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Name</label>
                        <input
                            type="text"
                            name="name"
                            placeholder="Enter student name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Course</label>
                        <input
                            type="text"
                            name="course"
                            placeholder="Enter course"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="primary-btn">
                    Add Student
                </button>

            </form>

        </section>


        <!-- Students -->
        <section class="card">

            <h2>Student Records</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- Update Student -->
        <section id="updateSection" class="card" style="display: none;">

            <h2>Update Student</h2>

            <form id="updateForm">

                <input type="hidden" id="updateId">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Name</label>
                        <input
                            type="text"
                            id="updateName"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="updateEmail"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Course</label>
                        <input
                            type="text"
                            id="updateCourse"
                            required
                        >
                    </div>

                </div>

                <button type="submit" class="primary-btn">
                    Save Update
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        Student Management System | College Project
    </footer>


    <script>

        // Load students
        fetch("/students")
            .then(response => response.json())
            .then(students => {

                const table = document.getElementById("studentTable");

                students.forEach(student => {

                    table.innerHTML += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.email}</td>
                            <td>${student.course}</td>

                            <td>
                                <button
                                    class="update-btn"
                                    onclick="showUpdateForm(
                                        ${student.id},
                                        '${student.name}',
                                        '${student.email}',
                                        '${student.course}'
                                    )">
                                    Update
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent(${student.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;

                });

            });


        // Delete student
        function deleteStudent(id) {

            fetch(`/students/${id}`, {
                method: "DELETE"
            })

            .then(response => response.text())

            .then(message => {

                alert(message);

                location.reload();

            });

        }


        // Show update form
        function showUpdateForm(id, name, email, course) {

            document.getElementById("updateSection").style.display = "block";

            document.getElementById("updateId").value = id;
            document.getElementById("updateName").value = name;
            document.getElementById("updateEmail").value = email;
            document.getElementById("updateCourse").value = course;

            window.scrollTo({
                top: document.getElementById("updateSection").offsetTop,
                behavior: "smooth"
            });

        }


        // Update student
        document.getElementById("updateForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const id =
                    document.getElementById("updateId").value;

                const name =
                    document.getElementById("updateName").value;

                const email =
                    document.getElementById("updateEmail").value;

                const course =
                    document.getElementById("updateCourse").value;


                fetch(`/students/${id}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        course: course
                    })

                })

                .then(response => response.text())

                .then(message => {

                    alert(message);

                    location.reload();

                });

            });

    </script>

</body>

</html>
